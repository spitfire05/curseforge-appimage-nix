name: "CI and smoke"

on:
  # Daily smoke build to find new version of curseforge app:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
  push:
  workflow_dispatch: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
      - name: Building package
        run: nix build 
