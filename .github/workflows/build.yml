name: "CI and smoke"

on:
  # Daily smoke build; new upstream AppImage versions are picked up by
  # update-appimage-hash.yml, this just verifies the current pin still builds.
  schedule:
    - cron: '0 6 * * *'
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
      - name: Building package
        run: nix build 
